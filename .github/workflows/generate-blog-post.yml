name: Generate Blog Post

# Triggered automatically when a pull request is merged into main, or
# manually via workflow_dispatch so you can generate a post for any PR.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to generate a blog post from"
        required: true
        type: string
      source_repo:
        description: "Source repository containing the PR (owner/repo). Defaults to this repo."
        required: false
        type: string

jobs:
  generate:
    name: Generate Blog Post Draft
    # Run on merged PRs or on manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate blog post draft
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set OPENAI_API_KEY for the OpenAI API, or GITHUB_MODELS_TOKEN for
          # GitHub Models. If neither is set the script falls back to
          # GITHUB_TOKEN with the GitHub Models endpoint.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
          # Override the model via the AI_MODEL repository variable.
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o' }}
        run: python scripts/generate_post.py

      - name: Create review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TITLE: ${{ steps.generate.outputs.post_title }}
          POST_SLUG: ${{ steps.generate.outputs.post_slug }}
          SOURCE_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
          REPO_NAME: ${{ github.repository }}
        run: |
          BRANCH_NAME="blog-draft/$(date +%Y%m%d)-${POST_SLUG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add posts/drafts/
          git commit -m "Add blog post draft: ${POST_TITLE}"
          git push origin "$BRANCH_NAME"

          # Create the label if it does not already exist.
          gh label create "blog-draft" \
            --description "Blog post draft awaiting editorial review" \
            --color "0075ca" 2>/dev/null || true

          # Build the PR body using printf to avoid YAML block-scalar issues.
          PR_BODY=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "## Blog Post Draft for Review" \
            "This post was automatically generated from [${SOURCE_REPO}#${SOURCE_PR}](https://github.com/${SOURCE_REPO}/pull/${SOURCE_PR})." \
            "Please review the generated content, make any edits you feel are necessary, and approve when ready to publish. **Once this PR is merged, the post will be automatically moved to \`posts/published/\`.**" \
            "*Generated by [BrewPress](https://github.com/${REPO_NAME}) 🍵*")

          gh pr create \
            --title "📝 Blog Draft: ${POST_TITLE}" \
            --body "$PR_BODY" \
            --label "blog-draft" \
            --base main
