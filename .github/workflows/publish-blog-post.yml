name: Publish Blog Post

# Triggered when a blog-draft PR is merged into main.
# Moves the draft(s) to posts/published/ and marks them as published.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    name: Publish Blog Post
    # Only run when a blog-draft branch is merged (not closed without merging).
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'blog-draft/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Publish blog post
        id: publish
        run: python scripts/publish_post.py

      - name: Commit published post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add posts/
          # Only commit if there are staged changes.
          git diff --cached --quiet || \
            git commit -m "Publish blog post(s) 🍵 [skip ci]"
          git push origin main
