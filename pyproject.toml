[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brewpress"
version = "1.0.0"
description = "ADK-powered technical blog generation and WordPress publishing for DevelopersCoffee"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "DevelopersCoffee" }
]
keywords = [
  "adk",
  "agents",
  "wordpress",
  "seo",
  "blog-automation",
  "developer-tools"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "pydantic>=2.0",
  "google-genai>=1.0",
  "requests>=2.28",
  "markdown>=3.0",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.urls]
Homepage = "https://github.com/DevelopersCoffee/BrewPress"
Repository = "https://github.com/DevelopersCoffee/BrewPress"
Issues = "https://github.com/DevelopersCoffee/BrewPress/issues"

[project.scripts]
brewpress = "brewpress.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
